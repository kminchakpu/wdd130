<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Get in touch with White Water Rafting Company in Kolob, California. Ask questions, make reservations, or meet our expert team.">
    <meta name="author" content="Kevin Cross Minchakpu">
    <title>Contact Us | Whitewater Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <!---Header Section-->
    <header>
        <img src="images/logo.png" alt="Rafting Company Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- COMPANY INFO -->
        <section class="container">
            <h1 class="title">White Water Rafting Company</h1>

            <p class="contact-info">
                123 Main River Street <br>
                Kolob, California <br>
                +1 999 999 9999 <br>
                info@whitewater.com
            </p>

        </section>

        <!-- CONTACT SECTION -->
        <section class="contact-wrapper">

            <!-- MAP -->
            <div class="map-box">

                <div class="map-placeholder">

                    <iframe class="iframe" title="Company Location Map"
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3132.636350707581!2d-122.07412632574191!3d38.264739283788124!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808516a58c6cbdd7%3A0xbce548206b7e0c73!2sKolob%20Dr%2C%20Fairfield%2C%20CA%2094534%2C%20USA!5e0!3m2!1sen!2sng!4v1770841049520!5m2!1sen!2sng"
                      loading="lazy" allowfullscreen="" referrerpolicy="no-referrer-when-downgrade">
                    </iframe>

                </div>

            </div>

            <!-- FORM -->
            <form class="contact-form">

                <div class="form-item">
                    <label for="name">Name</label>

                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div class="form-item">
                    <label for="email">Email</label>

                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <!-- RADIO BUTTONS -->
                <fieldset class="radio-group">

                    <legend>Message Purpose</legend>

                    <label for="purpose-general">
                        <input type="radio" id="purpose-general" name="purpose" value="general"
                          checked>

                        General Inquiry
                    </label>

                    <label for="purpose-reservation">
                        <input type="radio" id="purpose-reservation" name="purpose"
                          value="reservation">

                        Reservation Question
                    </label>

                    <label for="purpose-website">
                        <input type="radio" id="purpose-website" name="purpose" value="website">

                        Website Suggestion
                    </label>

                </fieldset>

                <!-- MESSAGE -->
                <div class="textarea-block">

                    <label for="message">Message</label>

                    <textarea id="message" name="message" rows="5" placeholder="Type here"
                      required></textarea>

                </div>

                <!-- CHECKBOX -->
                <div class="checkbox-block">

                    <input type="checkbox" id="subscribe" name="subscribe" value="yes">

                    <label for="subscribe">
                        Please Subscribe me to the monthly newsletter
                    </label>

                </div>

                <!-- BUTTON -->
                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <!-- TEAM SECTION -->
        <section class="team-section">

            <h2>We Are Here to Serve You</h2>

            <div class="profile-container">

                <figure class="profile-card">

                    <div class="profile-img">
                        <img src="images/profile1.jpg" alt="Employee Photo">
                    </div>

                    <figcaption>Kevin Cross</figcaption>

                </figure>

                <figure class="profile-card">

                    <div class="profile-img">
                        <img src="images/profile2.png" alt="Employee Photo">
                    </div>

                    <figcaption>Caroline Nyanga</figcaption>

                </figure>

                <figure class="profile-card">

                    <div class="profile-img">
                        <img src="images/profile3.jpg" alt="Employee Photo">
                    </div>

                    <figcaption>KCMinchakpu</figcaption>

                </figure>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Kevin Cross Minchakpu</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.webp" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin.webp" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.webp" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
